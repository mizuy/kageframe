[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "kageframe"
dynamic = ["version"]
description = "KageFrame - a statistical shadow of your DataFrame. Profile clinical data locally and generate statistically similar dummy datasets for code development."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]

[tool.hatch.version]
path = "src/kageframe/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/kageframe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: statistical or performance tests that take longer to run",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
